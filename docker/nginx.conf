# The whole app is static files (scripts/build_dist.py). no-cache so a rebuilt
# script is never served next to a cached one; the browser still revalidates
# cheaply with ETags.
server {
    listen 9000;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
