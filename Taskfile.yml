version: "3"

# DOCKER_DEFAULT_PLATFORM=linux/amd64 is set globally in this user's shell
# (for other projects), but this project's docker-compose.yml pins
# platform: linux/arm64 per service so builds run natively on Apple Silicon
# instead of crashing under QEMU emulation. Compose refuses to start when the
# global env var conflicts with an explicit per-service platform, so every
# compose invocation here needs DOCKER_DEFAULT_PLATFORM unset. These tasks do
# that for you instead of requiring `env -u DOCKER_DEFAULT_PLATFORM ...` by hand.
tasks:
  vendor:ena-browser:
    desc: >
      Download the ena-browser IIFE bundle + CSS at ENA_BROWSER_REF into
      app/static/vendor/ena-browser/. Re-run after bumping the tag.
    vars:
      ENA_BROWSER_REF: v0.1.3
    cmds:
      - mkdir -p app/static/vendor/ena-browser
      - for: ["ena-browser.iife.js", "ena-browser.css"]
        cmd: >
          curl -fsSL -o app/static/vendor/ena-browser/{{.ITEM}}
          https://github.com/EBI-Metagenomics/ena-browser/releases/download/{{.ENA_BROWSER_REF}}/{{.ITEM}}

  build:py:
    desc: >
      Build app/static/py/app.zip, the Python the browser worker runs (pinned
      EBI packages from .venv + server modules). Re-run after `uv sync` or
      editing app/*.py.
    cmds:
      - .venv/bin/python scripts/build_py_bundle.py

  build:dist:
    desc: >
      Build dist/, the whole app as static files (scripts/build_dist.py). Pass
      --dh <bundle> to include a built DataHarmonizer bundle
      (default app/static/dh, if built).
    cmds:
      - .venv/bin/python scripts/build_dist.py {{.CLI_ARGS}}

  serve:
    desc: Build dist/ and serve it on http://127.0.0.1:9000 (no-cache, for local use)
    cmds:
      - task: build:dist
      - .venv/bin/python scripts/serve_dist.py {{.CLI_ARGS}}

  build:indexes:
    desc: >
      Regenerate schemas/index.json and assets/ena_schema/index.json (a static
      host cannot list directories). Re-run after adding a schema or checklist.
    cmds:
      - .venv/bin/python scripts/build_static_indexes.py

  test:
    desc: Run the pytest suite (Python unit tests + Playwright UI tests on a built dist/, no Docker)
    cmds:
      - .venv/bin/python -m pytest {{.CLI_ARGS}}

  test:ui:
    desc: Run the Playwright UI tests against a built dist/ served in-process
    cmds:
      - .venv/bin/python -m pytest tests/test_ui.py {{.CLI_ARGS}}

  test:compose:
    desc: >
      Run Playwright against the real docker compose stack (builds the image;
      takes minutes). See README "Docker Compose tests".
    cmds:
      - COMPOSE_TEST=1 .venv/bin/python -m pytest tests/test_compose_ui.py {{.CLI_ARGS}}

  up:
    desc: Start the stack, building images as needed
    cmds:
      - unset DOCKER_DEFAULT_PLATFORM && docker compose up --build {{.CLI_ARGS}}

  up:local:
    desc: Start the Compose stack locally in the background (without read-helper-app)
    cmds:
      - unset DOCKER_DEFAULT_PLATFORM && docker compose up --build -d {{.CLI_ARGS}}

  up:local:with-helper:
    desc: Start the local Compose stack, then the read-helper-app companion in the foreground
    cmds:
      - task: up:local
      - task: start:read-helper-app

  start:read-helper-app:
    desc: Start the read-helper-app Electron companion (../read-helper-app)
    dir: ../read-helper-app
    dotenv: ["{{.ROOT_DIR}}/.env"]
    cmds:
      - npm run dev


  build:
    desc: Build images without starting containers
    cmds:
      - unset DOCKER_DEFAULT_PLATFORM && docker compose build {{.CLI_ARGS}}

  down:
    desc: Stop the stack
    cmds:
      - unset DOCKER_DEFAULT_PLATFORM && docker compose down {{.CLI_ARGS}}

  logs:
    desc: Tail logs for all (or a named) service
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  rebuild:dh:
    desc: >
      Deep-rebuild mimicc-server and dhtb after a DataHarmonizer or
      dataharmonizer-template-builder tag bump. Plain `task build`/`up --build`
      can reuse a cached `git clone` layer, so this builds with --no-cache.
    cmds:
      - unset DOCKER_DEFAULT_PLATFORM && docker compose build --no-cache mimicc-server dhtb
      - unset DOCKER_DEFAULT_PLATFORM && docker compose up -d mimicc-server dhtb {{.CLI_ARGS}}
